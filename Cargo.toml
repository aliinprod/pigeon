[workspace]
resolver = "2"
members = ["crates/pigeon-core", "crates/pigeon-agent", "crates/pigeon-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# Not published to crates.io (also keeps `cargo deny` wildcard checks meaningful).
publish = false

[workspace.dependencies]
pigeon-core = { path = "crates/pigeon-core" }
iroh = "=1.5.0"
tokio = { version = "=1.54.1", features = ["full"] }
serde = { version = "=1.0.229", features = ["derive"] }
postcard = { version = "=1.2.0", features = ["use-std"] }
anyhow = "=1.0.104"
clap = { version = "=4.6.9", features = ["derive"] }
sha2 = "=0.11.1"
subtle = "=2.6.1"
data-encoding = "=2.11.1"
getrandom = "=0.4.3"
tempfile = "=3.27.0"
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
