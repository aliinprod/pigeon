[workspace]
resolver = "2"
members = ["crates/pigeon-core", "crates/pigeon-agent", "crates/pigeon-cli"]
# The desktop app is its own workspace (app/src-tauri/Cargo.toml).
exclude = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# Not published to crates.io (also keeps `cargo deny` wildcard checks meaningful).
publish = false

[workspace.dependencies]
pigeon-core = { path = "crates/pigeon-core" }
iroh = "=1.5.0"
tokio = { version = "=1.54.1", features = ["full"] }
serde = { version = "=1.0.229", features = ["derive"] }
postcard = { version = "=1.2.0", features = ["use-std"] }
anyhow = "=1.0.104"
clap = { version = "=4.6.9", features = ["derive"] }
sha2 = "=0.11.1"
data-encoding = "=2.11.1"
getrandom = "=0.4.3"
zeroize = "=1.9.2"
# Pairing (docs/security/PAIRING.md): RustCrypto SPAKE2 + HKDF/HMAC-SHA256.
spake2 = "=0.4.0"
hkdf = "=0.13.0"
hmac = "=0.13.0"
serde_json = "=1.0.154"
# OS keystores (already in the tree via iroh/rustls; pinned to those versions).
security-framework = "=3.7.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_Security_Authorization", "Win32_System_Threading"] }
tempfile = "=3.27.0"
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
