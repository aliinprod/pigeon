<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pigeon App Design</title>
<meta name="description" content="Clickable design prototype for the Pigeon app: one app with Share and Get on macOS, Windows and Linux. Static HTML, no backend.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens (brand/BRAND.md) ---------- */
:root {
  --ink: #0B0B0B; --paper: #FFFFFF; --signal: #FF5A1F; --mist: #8A8F98;
  --page: #EEEEEC;
  --surface: #FFFFFF;
  --surface-2: #F6F6F5;
  --side: #F1F1F0;
  --chrome: #ECECEC;
  --text: #0B0B0B;
  --text-2: #5C6168;          /* Mist darkened for AA on white */
  --line: rgba(11,11,11,.11);
  --line-strong: rgba(11,11,11,.22);
  --hover: rgba(11,11,11,.05);
  --select: rgba(11,11,11,.08);
  --btn-bg: #0B0B0B; --btn-fg: #FFFFFF;
  --signal-soft: rgba(255,90,31,.10);
  --signal-text: #C2410C;     /* Signal darkened for text on white (AA) */
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 40px rgba(0,0,0,.14);
  --desk: linear-gradient(160deg, #D9D9D6 0%, #C9CACC 55%, #BDBFC2 100%);
  --bar: rgba(255,255,255,.72);
  --mica: linear-gradient(180deg, #EEF0F2, #F3F3F3);
  --logo-filter: brightness(1.08) contrast(1.25);
  --logo-blend: multiply;
  --f-head: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
  --f-mac: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
  --f-win: "Segoe UI Variable Text", "Segoe UI", "Inter", sans-serif;
  --f-gtk: "Cantarell", "Inter", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #050505; --surface: #161616; --surface-2: #1C1C1C; --side: #1E1E1E; --chrome: #232323;
    --text: #F4F4F2; --text-2: #A7ABB2; --line: rgba(255,255,255,.11); --line-strong: rgba(255,255,255,.24);
    --hover: rgba(255,255,255,.06); --select: rgba(255,255,255,.10);
    --btn-bg: #F4F4F2; --btn-fg: #0B0B0B; --signal-soft: rgba(255,90,31,.16); --signal-text: #FF7A45;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 16px 48px rgba(0,0,0,.6);
    --desk: linear-gradient(160deg, #1B1C1E 0%, #121314 60%, #0B0B0C 100%);
    --bar: rgba(30,30,30,.72); --mica: linear-gradient(180deg, #24262A, #202020);
    --logo-filter: invert(1) contrast(1.25) brightness(.92); --logo-blend: screen; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #050505; --surface: #161616; --surface-2: #1C1C1C; --side: #1E1E1E; --chrome: #232323;
  --text: #F4F4F2; --text-2: #A7ABB2; --line: rgba(255,255,255,.11); --line-strong: rgba(255,255,255,.24);
  --hover: rgba(255,255,255,.06); --select: rgba(255,255,255,.10);
  --btn-bg: #F4F4F2; --btn-fg: #0B0B0B; --signal-soft: rgba(255,90,31,.16); --signal-text: #FF7A45;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 16px 48px rgba(0,0,0,.6);
  --desk: linear-gradient(160deg, #1B1C1E 0%, #121314 60%, #0B0B0C 100%);
  --bar: rgba(30,30,30,.72); --mica: linear-gradient(180deg, #24262A, #202020);
  --logo-filter: invert(1) contrast(1.25) brightness(.92); --logo-blend: screen; color-scheme: dark;
}

/* ---------- Page shell ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--text); font: 400 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; border-radius: 6px; }
.logo { display: block; filter: var(--logo-filter); mix-blend-mode: var(--logo-blend); object-fit: cover; }
.mono { font-family: var(--f-mono); }

.top { position: sticky; top: 0; z-index: 50; background: var(--page); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px 16px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font: 700 16px/1 var(--f-head); letter-spacing: -.01em; margin-right: auto; }
.brand .logo { width: 30px; height: 30px; }
.brand small { font: 500 12px var(--f-body); color: var(--text-2); letter-spacing: 0; }
.seg { display: inline-flex; background: var(--hover); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; cursor: pointer; font-weight: 500; font-size: 13px; color: var(--text-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.soon { font: 600 10px var(--f-body); text-transform: uppercase; letter-spacing: .06em; border: 1px dashed var(--line-strong); border-radius: 99px; padding: 1px 6px; margin-left: 4px; color: var(--text-2); }
.states { max-width: 1280px; margin: 0 auto; padding: 10px 16px 0; display: flex; flex-wrap: wrap; gap: 6px 14px; }
.sgroup { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sgroup > span { font: 500 11px var(--f-body); text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); margin-right: 2px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; color: var(--text); }
.chip:hover { background: var(--hover); }
.chip[aria-current="true"] { background: var(--text); color: var(--page); border-color: var(--text); }
.chip.warn::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--signal); margin-right: 6px; vertical-align: 1px; }
.state-select { display: none; width: 100%; }
.stage { max-width: 1280px; margin: 0 auto; padding: 16px 16px 40px; }
.note { max-width: 880px; margin: 14px auto 0; color: var(--text-2); font-size: 13px; text-align: center; }
.note b { color: var(--text); font-weight: 600; }
body.bare .top, body.bare .states, body.bare .note { display: none; }
body.bare .stage { padding: 0; max-width: none; }

/* ---------- Shared UI ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); border-radius: 7px; padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }
.btn.primary:hover { opacity: .88; }
.btn.danger { color: var(--signal-text); }
.btn.danger-fill { background: var(--signal); color: #fff; border-color: var(--signal); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.demo { border-style: dashed; color: var(--text-2); background: transparent; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.btn.lg { padding: 9px 18px; font-size: 14px; }
.ico { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ico.lg { width: 22px; height: 22px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line-strong); white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; display: inline-block; }
.dot.off, .pill.off .dot { background: transparent; border: 1.5px solid currentColor; width: 8px; height: 8px; }
.pill.off { color: var(--text-2); }
.route { font: 500 11px var(--f-body); padding: 1px 7px; border-radius: 5px; border: 1px solid var(--line-strong); white-space: nowrap; display: inline-flex; gap: 4px; align-items: center; }
.route.relay { border-style: dashed; cursor: pointer; background: transparent; color: var(--text); }
.route.relay:hover { background: var(--hover); }
.tag { font: 500 11px var(--f-body); color: var(--text-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; white-space: nowrap; }
.muted { color: var(--text-2); }
.small { font-size: 12px; }
.h1 { font: 700 22px/1.2 var(--f-head); letter-spacing: -.015em; margin: 0; }
.h2 { font: 700 16px/1.25 var(--f-head); letter-spacing: -.01em; margin: 0; }
.h3 { font: 600 13px/1.3 var(--f-body); margin: 0; }
.label { font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-size: 13px; }
.banner.attn { border-color: rgba(255,90,31,.45); background: var(--signal-soft); }
.banner.attn > .ico { color: var(--signal); }
.banner p { margin: 0; }
.banner b { font-weight: 600; }
.field { width: 100%; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); border-radius: 7px; padding: 7px 10px; font: inherit; font-size: 13px; }
.kbd { font: 500 11px var(--f-mono); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
.fp { font: 500 13px var(--f-mono); letter-spacing: .06em; }
.bar { height: 6px; border-radius: 99px; background: var(--select); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--text); border-radius: 99px; transition: width .4s linear; }
.bar.paused > i { background: var(--mist); }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--text); animation: spin 1s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.toggle { width: 34px; height: 20px; border-radius: 99px; background: var(--line-strong); position: relative; flex: none; border: 0; cursor: pointer; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .15s; }
.toggle[aria-checked="true"] { background: var(--text); }
.toggle[aria-checked="true"]::after { left: 16px; background: var(--page); }
.toggle[disabled] { opacity: .5; cursor: not-allowed; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.big-check { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--text); display: grid; place-items: center; margin: 4px 0 10px; }
.big-x { border-color: var(--signal); color: var(--signal); }
.step-n { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--text); display: inline-grid; place-items: center; font: 600 11px var(--f-body); flex: none; }
.code-words { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.code-words div { border: 1px solid var(--line-strong); border-radius: 8px; padding: 10px 4px 8px; text-align: center; background: var(--surface-2); }
.code-words b { display: block; font: 500 19px var(--f-mono); }
.code-words small { font: 500 10px var(--f-mono); color: var(--text-2); }
.linkbox { display: flex; gap: 8px; align-items: center; }
.linkbox code { flex: 1; min-width: 0; font: 400 12.5px var(--f-mono); border: 1px solid var(--line-strong); border-radius: 7px; padding: 7px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--surface-2); }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; font: 500 11.5px var(--f-body); color: var(--text-2); padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.list { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.list .li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.list .li:first-child { border-top: 0; }

/* Direction (who gets from whom) */
.dir { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.dir .arrow { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; flex: none; }
.dir.no { color: var(--text-2); }
.dir.no .arrow { border-style: dashed; }
.dir b { font-weight: 600; }
.flow { display: flex; align-items: center; gap: 8px; font-size: 12px; flex-wrap: wrap; }
.flow .n { border: 1px solid var(--line-strong); border-radius: 6px; padding: 3px 8px; background: var(--surface); white-space: nowrap; }
.flow .ln { flex: 1; min-width: 28px; border-top: 1.5px solid var(--text); position: relative; }
.flow .ln::after { content: ""; position: absolute; right: -1px; top: -5px; border: 4.5px solid transparent; border-left: 7px solid var(--text); }
.flow .ln.dash { border-top-style: dashed; border-color: var(--line-strong); }
.flow .ln.dash::after { border-left-color: var(--line-strong); }
.choice { text-align: left; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 12px; padding: 16px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; }
.choice:hover { border-color: var(--text); }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

/* ---------- Desktops ---------- */
.desk { position: relative; border-radius: 12px; overflow: hidden; background: var(--desk); min-height: 720px; border: 1px solid var(--line); display: flex; flex-direction: column; }
.desk-area { position: relative; flex: 1; padding: 24px 20px; display: flex; justify-content: center; align-items: flex-start; }
.desk.win .desk-area { padding-bottom: 72px; }
/* macOS menu bar */
.menubar { height: 28px; display: flex; align-items: center; gap: 4px; padding: 0 10px; background: var(--chrome); font: 500 13px var(--f-mac); flex: none; }
.menubar .left { display: flex; gap: 16px; align-items: center; padding-left: 6px; }
.menubar .right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.mb-item { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 5px; height: 22px; border: 0; background: transparent; }
.mb-item .logo { width: 22px; height: 22px; }
.mb-item.pigeon { cursor: pointer; position: relative; }
.mb-item.pigeon.active { background: var(--select); }
.busy::after { content: ""; position: absolute; right: 3px; top: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--signal); }
.mb-item .ico { width: 15px; height: 15px; }
/* Windows taskbar */
.taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: var(--chrome); border-top: 1px solid var(--line); display: flex; align-items: center; padding: 0 10px; font: 400 12px var(--f-win); }
.taskbar .apps { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
.taskbar .apps span { width: 36px; height: 36px; border-radius: 5px; display: grid; place-items: center; }
.taskbar .apps span i { width: 20px; height: 20px; border-radius: 4px; background: var(--line-strong); display: block; }
.taskbar .apps span.on { background: var(--select); }
.taskbar .apps span .logo { width: 24px; height: 24px; }
.taskbar .tray { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.taskbar .tray .t { height: 36px; min-width: 30px; padding: 0 6px; display: grid; place-items: center; border-radius: 5px; border: 0; background: transparent; position: relative; }
.taskbar .tray .t.active { background: var(--select); }
.taskbar .tray .t .logo { width: 20px; height: 20px; }
.taskbar .clock { text-align: right; line-height: 1.25; padding: 0 6px; }
/* GNOME top bar */
.gnome-bar { height: 30px; flex: none; background: #000; color: #fff; display: flex; align-items: center; padding: 0 12px; font: 600 13px var(--f-gtk); }
.gnome-bar .act { padding: 2px 10px; border-radius: 99px; background: rgba(255,255,255,.14); }
.gnome-bar .mid { position: absolute; left: 50%; transform: translateX(-50%); }
.gnome-bar .sys { margin-left: auto; display: flex; gap: 8px; }

/* ---------- Windows (app frames) ---------- */
.window { width: 100%; max-width: 1040px; background: var(--surface); border-radius: 10px; border: 1px solid var(--line-strong); box-shadow: var(--shadow); overflow: hidden; position: relative; }
.win .window { border-radius: 8px; }
.linux .window { border-radius: 12px; }
.tbar { height: 40px; display: flex; align-items: center; position: relative; background: var(--chrome); border-bottom: 1px solid var(--line); font: 600 13px var(--f-mac); justify-content: center; }
.lights { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; background: #FF5F57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.2); }
.lights i:nth-child(2) { background: #FEBC2E; }
.lights i:nth-child(3) { background: #28C840; }
.win .tbar { height: 34px; justify-content: flex-start; gap: 8px; padding-left: 12px; background: var(--mica); border-bottom: 0; font: 400 12px var(--f-win); }
.win .tbar .logo { width: 20px; height: 20px; }
.caps { margin-left: auto; display: flex; height: 100%; }
.caps span { width: 46px; display: grid; place-items: center; }
.caps span:hover { background: var(--hover); }
.caps span:last-child:hover { background: #C42B1C; color: #fff; }
.caps .ico { width: 11px; height: 11px; stroke-width: 1.1; }
.linux .tbar { height: 46px; font: 700 14px var(--f-gtk); background: var(--chrome); }
.linux .tbar .gclose { position: absolute; right: 10px; width: 24px; height: 24px; border-radius: 50%; background: var(--select); display: grid; place-items: center; }
.linux .tbar .gclose .ico { width: 12px; height: 12px; stroke-width: 2; }
.linux .tbar .soon { position: absolute; left: 12px; }
.app { display: flex; min-height: 600px; }
.win .app { background: var(--mica); }
.side { width: 228px; flex: none; padding: 10px 8px 12px; display: flex; flex-direction: column; gap: 1px; background: var(--side); border-right: 1px solid var(--line); }
.win .side { background: transparent; border-right: 0; }
.side .me { display: flex; gap: 10px; align-items: center; padding: 6px 10px 12px; }
.side .me-ico { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line-strong); display: grid; place-items: center; background: var(--surface); }
.side .sec { font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); padding: 12px 10px 4px; display: flex; align-items: center; gap: 6px; }
.side button.nav { border: 0; background: transparent; text-align: left; display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 6px; cursor: pointer; position: relative; font-size: 13px; }
.side button.nav:hover { background: var(--hover); }
.side button.nav[aria-current="true"] { background: var(--select); font-weight: 600; }
.win .side button.nav[aria-current="true"]::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--text); }
.side .count { margin-left: auto; font: 500 11px var(--f-mono); background: var(--text); color: var(--page); border-radius: 99px; padding: 0 6px; }
.side .st { margin-left: auto; font-size: 11px; color: var(--text-2); font-weight: 400; display: inline-flex; align-items: center; gap: 5px; }
.side .spacer { flex: 1; }
.main { flex: 1; min-width: 0; background: var(--surface); display: flex; flex-direction: column; position: relative; }
.win .main { border-top-left-radius: 8px; border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
.main.center { align-items: center; justify-content: center; padding: 28px 16px; }
.m-head { padding: 18px 24px 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.m-content { padding: 0 24px 20px; flex: 1; }
.m-status { padding: 8px 24px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-2); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.kicker { font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); display: flex; gap: 6px; align-items: center; }
.crumbs { display: flex; align-items: center; gap: 4px; font: 700 19px var(--f-head); letter-spacing: -.01em; flex-wrap: wrap; min-width: 0; }
.crumbs button { border: 0; background: transparent; padding: 2px 4px; border-radius: 5px; cursor: pointer; font: inherit; color: var(--text-2); }
.crumbs button:hover { background: var(--hover); color: var(--text); }
.crumbs .cur { padding: 2px 4px; }
.crumbs .ico { color: var(--text-2); width: 14px; height: 14px; }
.search { position: relative; width: 240px; max-width: 100%; }
.search .ico { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text-2); }
.search input { padding-left: 32px; }
.files { width: 100%; border-collapse: collapse; font-size: 13px; }
.files th { text-align: left; font-weight: 500; font-size: 12px; color: var(--text-2); padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }

const st = { p: 'mac', s: 'tray', t: 'auto', bare: false, q: 'scan', attempts: 3, code: ['otter','plaza','cru',''], sel: null, path: {}, xfers: {} };
function xfersFor(p) {
  if (!st.xfers[p]) st.xfers[p] = (XT[PLAT[p].getFrom] || []).map((x, i) => ({ ...x, id: p + i }));
  return st.xfers[p];
}
function pathFor(p) { return st.path[p] || (st.path[p] = FS[PLAT[p].getFrom].start); }

function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (PLAT[h.get('p')]) st.p = h.get('p');
  const s = h.get('s');
  st.s = (s && screensFor(st.p).some(x => x[1] === s)) ? s : (st.p === 'linux' ? 'g-browse' : 'tray');
  st.t = ['light','dark','auto'].includes(h.get('t')) ? h.get('t') : 'auto';
  st.bare = h.get('bare') === '1';
}
function writeHash() {
  const h = new URLSearchParams({ p: st.p, s: st.s });
  if (st.t !== 'auto') h.set('t', st.t);
  if (st.bare) h.set('bare', '1');
  try { history.replaceState(null, '', '#' + h.toString()); } catch (_) {}
}

/* ---------- Pairing (choose, get side) ---------- */

    <div class="row" style="margin-top:18px;justify-content:space-between">${B('Back', { go: 'g-link' })}${B('Pair', { k: 'primary lg', act: 'pair' })}</div>`, 2);

function gPaired() {

/* ---------- Get: browse / transfers ---------- */
function listing(fs, path) {
  const d = fs.dirs[path] || { folders: [], files: [] };
  return [...d.folders.map(f => ({ folder: true, name: f, path: path + '/' + f, count: (fs.dirs[path + '/' + f]?.files.length || 0) })),
          ...d.files.map(([name,size,mod]) => ({ name, size, mod }))];
}
function filesTable(rows, { disabled = false, showPath = false } = {}) {
  return `<table class="files ${disabled?'disabled-list':''}"><thead><tr><th>Name</th>${showPath?'<th class="hide-sm">Folder</th>':''}<th class="num">Size</th><th class="hide-sm">Modified</th><th></th></tr></thead><tbody>
    ${rows.map(r => r.folder
      ? `<tr class="f folder" data-act="open" data-path="${esc(r.path)}"><td class="name"><div class="row">${ic('folder')}<span class="trunc">${esc(r.name)}</span></div></td>${showPath?'<td class="hide-sm"></td>':''}<td class="num">${r.count} items</td><td class="hide-sm"></td><td class="act">${ic('chev')}</td></tr>`
      : `<tr class="f ${st.sel===r.name?'sel':''}" data-act="sel" data-name="${esc(r.name)}"><td class="name"><div class="row">${ic('file')}<span class="trunc">${esc(r.name)}</span></div></td>${showPath?`<td class="hide-sm muted small">${esc(r.path)}</td>`:''}<td class="num">${r.size}</td><td class="hide-sm muted small">${r.mod}</td><td class="act">${B('Get', { k: 'sm getbtn', i: 'down', act: 'get', aria: 'Get ' + r.name, data: `data-name="${esc(r.name)}" data-size="${esc(r.size)}"` })}</td></tr>`).join('')}
  </tbody></table>`;
}
function browse(s) {
  const X = PLAT[st.p], G = X.getFrom, fs = FS[G], off = s === 'g-offline', search = s === 'g-search';
  const path = pathFor(st.p);
  if (st.sel === null) st.sel = fs.dirs[path]?.files[0]?.[0];
  let rows, title;
  if (search) {
    const q = st.q.toLowerCase(); rows = [];
    Object.entries(fs.dirs).forEach(([p,d]) => d.files.forEach(([name,size,mod]) => { if (q && name.toLowerCase().includes(q)) rows.push({ name, size, mod, path: p }); }));
    title = `<div class="crumbs"><span class="cur">Results for \u201c${esc(st.q)}\u201d</span></div>`;
  } else {
    let c = `<button data-act="open" data-path="${fs.roots[0]}">${G}</button>`;
    const root = fs.roots.find(r => path.startsWith(r)) || fs.roots[0];
    c += ic('chev') + (path === root ? `<span class="cur">${esc(root)}</span>` : `<button data-act="open" data-path="${esc(root)}">${esc(root)}</button>`);
    if (path !== root) c += ic('chev') + `<span class="cur">${esc(path.slice(root.length + 1))}</span>`;
    rows = listing(fs, path); title = `<div class="crumbs">${c}</div>`;
  }
  return `<div class="main">
    <div class="m-head" style="padding-bottom:4px"><div class="kicker" style="width:100%">${ic('down')}Get from ${G} ${ic('chev')} ${fs.roots.map(r => `<button class="chip" style="padding:1px 8px;font-size:11.5px;text-transform:none;letter-spacing:0" data-act="open" data-path="${esc(r)}" aria-current="${!search && path.startsWith(r)}">${esc(r)}</button>`).join(' ')}</div></div>
    <div class="m-head" style="padding-top:6px">${title}<div class="grow"></div>
      <div class="search">${ic('search')}<input class="field" id="q" placeholder="Search ${G}" value="${search?esc(st.q):''}" aria-label="Search file names" ${off?'disabled':''}></div>${online(!off)}</div>
    ${off ? `<div style="padding:0 24px 12px"><div class="banner attn">${ic('alert')}<p><b>${G} is offline.</b> Last seen today at 18:42. It may be asleep, shut down, or off the internet. Pigeon reconnects on its own. This list is from 18:42; you can\u2019t get files until ${G} is back.</p></div></div>` : ''}
    ${search ? `<div class="m-content" style="flex:none;padding-bottom:6px"><span class="small muted">${rows.length} ${rows.length===1?'file':'files'} in ${fs.roots.join(' and ')} · names only</span></div>` : ''}
    <div class="m-content">${rows.length ? filesTable(rows, { disabled: off, showPath: search }) : `<p class="muted" style="padding:30px 0;text-align:center">No file names match \u201c${esc(st.q)}\u201d.</p>`}</div>
    <div class="m-status">${ic('shield')}<span>Read-only. Files stay on ${G}.</span><span class="grow"></span><span>Saving to <span class="mono">${esc(X.dlShort)}</span></span></div>
  </div>`;
}
const fmt = x => x.unit === 'KB' ? x.size + ' KB' : x.size >= 1000 ? (x.size/1000).toFixed(1) + ' GB' : x.size + ' MB';
const fmtGot = x => x.got >= 1000 ? (x.got/1000).toFixed(2) + ' GB' : x.got < 10 ? x.got.toFixed(1) + ' MB' : Math.round(x.got) + ' MB';
function eta(x) { const s = Math.max(1, Math.round((x.size - x.got) / parseFloat(x.speed))); return s >= 60 ? Math.round(s/60) + ' min left' : s + ' s left'; }
function xferRow(x) {
  const pct = x.got != null ? Math.round(x.got / x.size * 100) : 100;
  if (x.state === 'done') return `<div class="xfer"><div class="fico">${ic('file')}</div>
    <div class="row" style="gap:8px;flex-wrap:wrap"><span class="h3 trunc">${esc(x.savedAs || x.name)}</span><span class="small muted mono">${fmt(x)}</span></div>
    <div class="acts">${B('Open', { k: 'sm', i: 'open' })}${B('Show in folder', { k: 'sm', i: 'folder' })}</div>
    <div class="meta"><span class="verified">${ic('check')}SHA-256 verified</span>${route(x.route)}<span>Done 09:39</span>${x.savedAs ? `<span>Saved as a new copy: <span class="mono">${esc(x.name)}</span> already existed</span>` : ''}</div></div>`;
  if (x.state === 'changed' || x.state === 'mismatch') return `<div class="xfer err"><div class="fico">${ic('alert')}</div>
    <div class="h3 trunc">${esc(x.name)}</div><div class="acts">${B(x.state==='changed'?'Get again':'Try again', { k: 'sm', i: 'refresh' })}</div>
    <div class="meta">${x.state==='changed'
      ? `<span style="color:var(--signal-text);font-weight:500">Changed on ${PLAT[st.p].getFrom} while downloading.</span><span>The partial copy was deleted so you don\u2019t get a mix of old and new.</span>`
      : `<span style="color:var(--signal-text);font-weight:500">Checksum didn\u2019t match.</span><span>The file was discarded. Nothing broken was saved.</span>`}</div></div>`;
  const paused = x.state === 'reconnecting' || x.state === 'waiting';
  const status = x.state === 'reconnecting' ? `<span class="row" style="gap:6px"><span class="spinner"></span>Connection lost at ${pct}%. Reconnecting… resumes from <span class="mono">${fmtGot(x)}</span></span>`
    : x.state === 'waiting' ? `<span>Paused until ${PLAT[st.p].getFrom} is reachable. Resumes from <span class="mono">${fmtGot(x)}</span>; nothing is downloaded twice.</span>`
    : `<span class="mono" data-m="${x.id}">${fmtGot(x)} of ${fmt(x)} · ${x.speed} · ${eta(x)}</span>`;
  return `<div class="xfer"><div class="fico">${ic('file')}</div>
    <div class="row" style="gap:8px"><span class="h3 trunc">${esc(x.name)}</span><span class="small muted mono" data-p="${x.id}">${pct}%</span></div>
    <div class="acts">${paused ? B('Cancel', { k: 'sm ghost', i: 'x' }) : B('Pause', { k: 'sm ghost', i: 'pause' })}</div>
    <div class="bar wide ${paused?'paused':''}"><i data-b="${x.id}" style="width:${pct}%"></i></div>
    <div class="meta wide">${route(x.route)}${status}</div></div>`;
}
function transfers(s) {
  const X = PLAT[st.p], base = xfersFor(st.p), done = base.filter(x => x.state === 'done');
  let list = base;
  if (s === 'g-dropped') { const a = base.filter(x => x.state !== 'done'); list = [{ ...a[0], id: 'd1', state: 'reconnecting' }, { ...a[1], id: 'd2', state: 'waiting', got: a[1].size * .48 }, ...done]; }
  if (s === 'g-changed') { const f = FS[X.getFrom].dirs[FS[X.getFrom].roots[0]].files; list = [{ id: 'c1', name: f[0][0], state: 'changed' }, { id: 'c2', name: f[1][0], state: 'mismatch' }, ...done]; }
  const active = list.filter(x => x.state !== 'done');
  const tip = s === 'g-relay' ? `<div class="tip" style="top:278px;left:46px" role="dialog" aria-label="Why relay">
      <div class="h3">Why \u201cRelay\u201d?</div>
      <p style="margin:6px 0 0">Something between ${X.thisX} and ${X.getFrom} (usually a firewall) blocks a direct link, so the bytes go through Pigeon\u2019s relay instead.</p>
      <div style="margin:10px 0">${flow(X.getFrom, 'Relay').replace('</div>', '')}<span class="ln"></span><span class="n">${X.me}</span></div></div>
      <p style="margin:0">They\u2019re encrypted end to end; the relay can\u2019t read them. <b>Slower, not less safe.</b> Pigeon switches to Direct if it becomes possible.</p>
      <div class="row" style="justify-content:flex-end;margin-top:10px">${B('Got it', { k: 'sm primary', go: 'g-transfers' })}</div></div>` : '';
  return `<div class="main">
    <div class="m-head"><div class="grow"><div class="kicker">${ic('down')}Get</div><div class="h1" style="margin-top:4px">Transfers</div></div>${B('Clear finished', { k: 'sm ghost' })}</div>
    <div class="m-content">
      ${active.length ? `<div class="label">In progress · from ${X.getFrom}</div>${active.map(xferRow).join('')}` : ''}
      ${done.length ? `<div class="label" style="margin-top:18px">Finished</div>${done.map(xferRow).join('')}` : ''}
    </div>
    <div class="m-status">${ic('folder')}<span>Saving to <span class="mono">${esc(X.dl)}</span></span><button class="btn sm ghost" data-go="settings">Change</button><span class="grow"></span><span>Never overwrites</span></div>
    ${tip}</div>`;
}

function welcome() {
  const X = PLAT[st.p];
  return `<div class="main center"><div style="max-width:640px;width:100%">${LOGO('hero', 'Pigeon')}
    <h1 class="h1" style="margin-top:10px">What do you want to do on ${X.thisX}?</h1>
    <p class="muted" style="margin:6px 0 18px">You can do both, and change it any time. Nothing is shared until you pick folders.</p>
    <div class="choices">
      <button class="choice" data-go="s-folders"><span class="kicker">${ic('share')}Share</span><div class="h2">Share folders from ${X.thisX}</div>
        <p class="small muted" style="margin:0">Pick folders. Your other computers can get files from them, read-only, after you pair them.</p></button>
      <button class="choice" data-go="g-link"><span class="kicker">${ic('down')}Get</span><div class="h2">Get files from another computer</div>
        <p class="small muted" style="margin:0">Browse and download from a computer you own that runs Pigeon and shares folders.</p></button>
    </div>
    <div class="row" style="margin-top:18px;justify-content:flex-end">${B('Skip for now', { go: 'devices' })}</div></div></div>`;
}
function notif(title, body) {
  return `<div class="notif" role="status">${LOGO()}<div class="grow"><b>${title}</b><div>${body}</div><div class="small muted">Not you? Open Pigeon \u2192 Devices \u2192 Revoke.</div></div><span class="small muted">now</span></div>`;
}

function screen(s) {
  const X = PLAT[st.p];
  switch (s) {
    case 'tray': return desk(trayPanel(false), { trayOpen: true });
    case 'tray-offline': return desk(trayPanel(true), { trayOpen: true, busy: false });
    case 'welcome': return page(welcome(), { side: false, title: 'Welcome to Pigeon' });
    case 'pair-choose': return page(pairChoose());
    case 'devices': return page(devices());
    case 'revoke': return page(devices(), { overlay: revokeOverlay() });
    case 'settings': return page(settings());
    case 's-folders': return page(sharedFolders());
    case 's-activity': return page(activity());
    case 's-invite': return page(inviteMain('new'));
    case 's-invite-wrong': return page(inviteMain('wrong'));
    case 's-burned': return page(inviteMain('burned'));
    case 's-expired': return page(inviteMain('expired'));
    case 's-paired': { const N = peerOf(st.p, X.newPeer); return page(sPaired(), { notif: notif('New device paired', `${N.name} can get files from ${X.thisX} · <span class="fp" style="font-size:12px">${N.fp}</span>`) }); }
    case 'g-link': return page(gLink());
    case 'g-code': return page(gCode(false));
    case 'g-code-wrong': return page(gCode(true));
    case 'g-paired': return page(gPaired());
    case 'g-burned': case 'g-expired': case 'g-used': return page(gProblem(s));
    case 'g-revoked': return page(gRevoked());
    case 'g-browse': case 'g-search': case 'g-offline': return page(browse(s));
    case 'g-transfers': case 'g-relay': case 'g-dropped': case 'g-changed': return page(transfers(s));
  }
}

/* ---------- Render ---------- */
const $ = sel => document.querySelector(sel);
let timer = null;
function render() {
  if (st.s === 'g-code-wrong' && st.attempts === 3) { st.attempts = 2; st.code = ['otter','plaza','crust','vivid']; }
  if (st.t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', st.t);
  document.body.classList.toggle('bare', st.bare);
  document.querySelectorAll('[data-plat]').forEach(b => b.setAttribute('aria-pressed', b.dataset.plat === st.p));
  document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeSet === st.t));
  const groups = {};
  screensFor(st.p).forEach(s => (groups[s[0]] = groups[s[0]] || []).push([s[1], labelOf(s, st.p), s[3]]));
  $('#states').innerHTML = Object.entries(groups).map(([g,items]) => `<div class="sgroup"><span>${g}</span>${items.map(([id,l,w]) => `<button class="chip ${w?'warn':''}" data-go="${id}" aria-current="${st.s===id}">${l}</button>`).join('')}</div>`).join('')
    + `<select class="field state-select" id="pick" aria-label="Screen">${Object.entries(groups).map(([g,items]) => `<optgroup label="${g}">${items.map(([id,l]) => `<option value="${id}" ${st.s===id?'selected':''}>${l}</option>`).join('')}</optgroup>`).join('')}</select>`;
  $('#pick').addEventListener('change', e => go(e.target.value));
  $('#frame').innerHTML = screen(st.s);
  $('#note').innerHTML = (NOTES[st.s] ? NOTES[st.s](PLAT[st.p]) : '') + (st.p === 'linux' ? ' <b>Linux is coming soon;</b> same app, GNOME-style window, no tray.' : '');
  writeHash(); wire();
}
function go(s) {
  if (!screensFor(st.p).some(x => x[1] === s)) s = 'devices';
  if (s === 'g-search' && !st.q) st.q = 'scan';
  st.s = s; render();
}
function wire() {
  clearInterval(timer);
  if (st.s === 'g-transfers' && !st.bare) timer = setInterval(tick, 600);
  const q = $('#q');
  if (q) {
    if (st.s === 'g-search') { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    q.addEventListener('input', () => { st.q = q.value; go(q.value.trim() ? 'g-search' : 'g-browse'); });
  }
  const wi = $('#wordin'); if (wi) wireCode(wi);
}
function tick() {
  let changed = false;
  xfersFor(st.p).forEach(x => {
    if (x.state !== 'active') return;
    x.got = Math.min(x.size, x.got + parseFloat(x.speed) * 0.6);
    if (x.got >= x.size) { x.state = 'done'; x.got = null; changed = true; return; }
    const pct = Math.round(x.got / x.size * 100);
    const b = document.querySelector(`[data-b="${x.id}"]`); if (b) b.style.width = pct + '%';
    const p = document.querySelector(`[data-p="${x.id}"]`); if (p) p.textContent = pct + '%';
    const m = document.querySelector(`[data-m="${x.id}"]`); if (m) m.textContent = `${fmtGot(x)} of ${fmt(x)} · ${x.speed} · ${eta(x)}`;
  });
  if (changed) render();
}

/* ---------- Code input with word autocompletion ---------- */
function wireCode(root) {
  const ins = [...root.querySelectorAll('input')];
  const matches = v => v.length < 2 ? [] : WORDS.filter(w => w.startsWith(v) && w !== v).slice(0, 4);
  const paint = (i, showList) => {
    const inp = ins[i], v = inp.value.trim().toLowerCase(), box = inp.parentElement, m = matches(v);
    root.querySelectorAll('.sugg').forEach(n => n.remove());
    box.querySelector('.ghost').textContent = (m[0] && document.activeElement === inp) ? ' '.repeat(v.length) + m[0].slice(v.length) : '';
    box.classList.toggle('unknown', !!v && !WORDS.includes(v) && !m.length);
    if (showList && m.length && document.activeElement === inp) {
      const d = document.createElement('div'); d.className = 'sugg';
      d.innerHTML = m.map(w => `<button type="button" tabindex="-1" data-word="${w}">${w}</button>`).join('');
      d.addEventListener('mousedown', e => { const b = e.target.closest('[data-word]'); if (!b) return; e.preventDefault(); accept(i, b.dataset.word); });
      box.appendChild(d);
    }
  };
  const accept = (i, w) => { ins[i].value = w; st.code[i] = w; paint(i, false); if (ins[i+1]) ins[i+1].focus(); else root.querySelectorAll('.sugg').forEach(n => n.remove()); };
  const fill = (start, words) => { words.forEach((w, k) => { if (ins[start+k]) { ins[start+k].value = w; st.code[start+k] = w; } }); (ins[Math.min(3, start + words.length)] || ins[3]).focus(); ins.forEach((_, k) => paint(k, false)); };
  ins.forEach((inp, i) => {
    inp.addEventListener('focus', () => paint(i, true));
    inp.addEventListener('blur', () => setTimeout(() => paint(i, false), 0));
    inp.addEventListener('input', () => {
      inp.parentElement.classList.remove('bad');
      const raw = inp.value.toLowerCase();
      if (/[\s\-·.,]/.test(raw)) {
        const parts = raw.split(/[\s\-·.,]+/).filter(Boolean);
        if (parts.length > 1) { fill(i, parts); return; }
        if (parts[0]) { const m = matches(parts[0]); accept(i, WORDS.includes(parts[0]) ? parts[0] : (m[0] || parts[0])); return; }
        inp.value = ''; return;
      }
      st.code[i] = inp.value.trim().toLowerCase(); paint(i, true);
    });
    inp.addEventListener('paste', e => {
      const parts = (e.clipboardData || window.clipboardData).getData('text').toLowerCase().split(/[^a-z]+/).filter(Boolean);
      if (parts.length > 1) { e.preventDefault(); fill(i, parts); }
    });
    inp.addEventListener('keydown', e => {
      const m = matches(inp.value.trim().toLowerCase());
      if (((e.key === 'Tab' && !e.shiftKey) || e.key === 'Enter') && m[0]) { e.preventDefault(); accept(i, m[0]); }
      else if (e.key === 'Enter') { e.preventDefault(); doPair(); }
      else if (e.key === 'Backspace' && !inp.value && ins[i-1]) { e.preventDefault(); ins[i-1].focus(); }
    });
  });
  const firstEmpty = st.code.findIndex(w => !WORDS.includes(w));
  if (st.s === 'g-code' && firstEmpty >= 0) { const el = ins[firstEmpty]; el.focus(); el.setSelectionRange(el.value.length, el.value.length); paint(firstEmpty, true); }
}
function doPair() {
  if (st.code.map(w => w.trim().toLowerCase()).join('-') === CODE.join('-')) { st.attempts = 3; go('g-paired'); return; }
  st.attempts -= 1;
  if (st.attempts <= 0) { st.attempts = 3; st.code = ['otter','plaza','cru','']; go('g-burned'); return; }
  st.s = 'g-code-wrong'; render();
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-plat],[data-theme-set],[data-go],[data-act]');
  if (!t || t.disabled) return;
  if (t.dataset.plat) { st.p = t.dataset.plat; st.sel = null; if (!screensFor(st.p).some(x => x[1] === st.s)) st.s = 'g-browse'; render(); return; }
  if (t.dataset.themeSet) { st.t = t.dataset.themeSet; render(); return; }
  if (t.dataset.go) { go(t.dataset.go); return; }
  const a = t.dataset.act;
  if (a === 'pair') doPair();
  else if (a === 'open') { st.path[st.p] = t.dataset.path; st.q = ''; go('g-browse'); }
  else if (a === 'sel') { st.sel = t.dataset.name; document.querySelectorAll('tr.sel').forEach(r => r.classList.remove('sel')); t.classList.add('sel'); }
  else if (a === 'get') {
    e.stopPropagation();
    const name = t.dataset.name, sz = t.dataset.size, n = parseFloat(sz), kb = /KB/.test(sz), size = /GB/.test(sz) ? n * 1000 : n;
    const list = xfersFor(st.p), exists = list.some(x => x.name === name);
    list.unshift(kb || size < 5
      ? { id: 'n' + Date.now(), name, size: n, unit: kb ? 'KB' : 'MB', state: 'done', route: 'direct', savedAs: exists ? name.replace(/(\.[^.]+)$/, ' (1)$1') : null }
      : { id: 'n' + Date.now(), name, size, unit: 'MB', got: 0, speed: '11.4 MB/s', route: 'direct', state: 'active' });
    go('g-transfers');
  }
  else if (a === 'toggle') t.setAttribute('aria-checked', t.getAttribute('aria-checked') !== 'true');
  else if (a === 'copy') { try { navigator.clipboard.writeText(LINK); } catch (_) {} t.querySelector('.lbl').textContent = 'Copied'; }
});
window.addEventListener('hashchange', () => { readHash(); render(); });
readHash(); render();
})();
</script>
</body>
</html>
