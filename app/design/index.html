<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pigeon App Design</title>
<meta name="description" content="Clickable design prototype for the Pigeon macOS agent and Windows client. Static HTML, no backend.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ---------- Tokens (brand/BRAND.md) ---------- */
:root {
  --ink: #0B0B0B;
  --paper: #FFFFFF;
  --signal: #FF5A1F;
  --mist: #8A8F98;

  --page: #EEEEEC;
  --surface: #FFFFFF;        /* window content */
  --surface-2: #F6F6F5;      /* sidebars, wells */
  --chrome: #ECECEC;         /* title bars */
  --text: #0B0B0B;
  --text-2: #5C6168;         /* Mist darkened for AA on white */
  --line: rgba(11,11,11,.11);
  --line-strong: rgba(11,11,11,.22);
  --hover: rgba(11,11,11,.05);
  --select: rgba(11,11,11,.08);
  --btn-bg: #0B0B0B;         /* primary = Ink */
  --btn-fg: #FFFFFF;
  --signal-soft: rgba(255,90,31,.10);
  --signal-text: #C2410C;    /* Signal darkened for text on white (AA) */
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 40px rgba(0,0,0,.14);
  --desk: linear-gradient(160deg, #D9D9D6 0%, #C9CACC 55%, #BDBFC2 100%);
  --menubar: rgba(255,255,255,.72);
  --mica: linear-gradient(180deg, #EEF0F2, #F3F3F3);
  --logo-filter: brightness(1.08) contrast(1.25);
  --logo-blend: multiply;

  --f-head: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
  --f-mac: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif;
  --f-win: "Segoe UI Variable Text", "Segoe UI", "Inter", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #050505; --surface: #161616; --surface-2: #1C1C1C; --chrome: #232323;
    --text: #F4F4F2; --text-2: #A7ABB2; --line: rgba(255,255,255,.11); --line-strong: rgba(255,255,255,.24);
    --hover: rgba(255,255,255,.06); --select: rgba(255,255,255,.10);
    --btn-bg: #F4F4F2; --btn-fg: #0B0B0B; --signal-soft: rgba(255,90,31,.16); --signal-text: #FF7A45;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 16px 48px rgba(0,0,0,.6);
    --desk: linear-gradient(160deg, #1B1C1E 0%, #121314 60%, #0B0B0C 100%);
    --menubar: rgba(30,30,30,.72); --mica: linear-gradient(180deg, #24262A, #202020);
    --logo-filter: invert(1) contrast(1.25) brightness(.92); --logo-blend: screen; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #050505; --surface: #161616; --surface-2: #1C1C1C; --chrome: #232323;
  --text: #F4F4F2; --text-2: #A7ABB2; --line: rgba(255,255,255,.11); --line-strong: rgba(255,255,255,.24);
  --hover: rgba(255,255,255,.06); --select: rgba(255,255,255,.10);
  --btn-bg: #F4F4F2; --btn-fg: #0B0B0B; --signal-soft: rgba(255,90,31,.16); --signal-text: #FF7A45;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 16px 48px rgba(0,0,0,.6);
  --desk: linear-gradient(160deg, #1B1C1E 0%, #121314 60%, #0B0B0C 100%);
  --menubar: rgba(30,30,30,.72); --mica: linear-gradient(180deg, #24262A, #202020);
  --logo-filter: invert(1) contrast(1.25) brightness(.92); --logo-blend: screen; color-scheme: dark;
}

/* ---------- Page shell ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--text); font: 400 14px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; border-radius: 6px; }
.logo { display: block; filter: var(--logo-filter); mix-blend-mode: var(--logo-blend); }
.mono { font-family: var(--f-mono); }

.top { position: sticky; top: 0; z-index: 50; background: var(--page); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px 16px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font: 700 16px/1 var(--f-head); letter-spacing: -.01em; margin-right: auto; }
.brand .logo { width: 30px; height: 30px; object-fit: cover; }
.brand small { font: 500 12px var(--f-body); color: var(--text-2); letter-spacing: 0; }
.seg { display: inline-flex; background: var(--hover); border: 1px solid var(--line); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; cursor: pointer; font-weight: 500; font-size: 13px; color: var(--text-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.states { max-width: 1240px; margin: 0 auto; padding: 10px 16px 0; display: flex; flex-wrap: wrap; gap: 6px 14px; }
.sgroup { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.sgroup > span { font: 500 11px var(--f-body); text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); margin-right: 2px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; color: var(--text); }
.chip:hover { background: var(--hover); }
.chip[aria-current="true"] { background: var(--text); color: var(--page); border-color: var(--text); }
.chip.warn::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--signal); margin-right: 6px; vertical-align: 1px; }

.stage { max-width: 1240px; margin: 0 auto; padding: 16px 16px 40px; }
.note { max-width: 860px; margin: 14px auto 0; color: var(--text-2); font-size: 13px; text-align: center; }
.note b { color: var(--text); font-weight: 600; }
body.bare .top, body.bare .states, body.bare .note { display: none; }
body.bare .stage { padding: 0; max-width: none; }
.state-select { display: none; width: 100%; }
@media (max-width: 760px) {
  .top { position: static; }
  .brand small { display: none; }
  .states .sgroup { display: none; }
  .state-select { display: block; padding: 8px 10px; font-size: 14px; }
  .states { padding-bottom: 10px; }
}

/* ---------- Shared UI ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); border-radius: 7px; padding: 6px 12px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }
.btn.primary:hover { opacity: .88; }
.btn.danger { color: var(--signal-text); }
.btn.danger-fill { background: var(--signal); color: #fff; border-color: var(--signal); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn.demo { border-style: dashed; color: var(--text-2); background: transparent; }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.btn.lg { padding: 9px 18px; font-size: 14px; }
.ico { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.ico.lg { width: 22px; height: 22px; }
.ico.xl { width: 36px; height: 36px; stroke-width: 1.4; }

.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line-strong); white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.pill.off .dot { background: transparent; border: 1.5px solid currentColor; width: 8px; height: 8px; }
.pill.off { color: var(--text-2); }
.route { font: 500 11px var(--f-body); padding: 1px 7px; border-radius: 5px; border: 1px solid var(--line-strong); white-space: nowrap; display: inline-flex; gap: 4px; align-items: center; }
.route.relay { border-style: dashed; cursor: pointer; background: transparent; color: var(--text); }
.route.relay:hover { background: var(--hover); }
.tag { font: 500 11px var(--f-body); color: var(--text-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; white-space: nowrap; }
.muted { color: var(--text-2); }
.small { font-size: 12px; }
.h1 { font: 700 22px/1.2 var(--f-head); letter-spacing: -.015em; margin: 0; }
.h2 { font: 700 16px/1.25 var(--f-head); letter-spacing: -.01em; margin: 0; }
.h3 { font: 600 13px/1.3 var(--f-body); margin: 0; }
.label { font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stack > * + * { margin-top: 12px; }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-size: 13px; }
.banner.attn { border-color: rgba(255,90,31,.45); background: var(--signal-soft); }
.banner.attn .ico { color: var(--signal); }
.banner p { margin: 0; }
.banner b { font-weight: 600; }
.field { width: 100%; border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); border-radius: 7px; padding: 7px 10px; font: inherit; font-size: 13px; }
.kbd { font: 500 11px var(--f-mono); border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
.fp { font: 500 13px var(--f-mono); letter-spacing: .06em; }
.bar { height: 6px; border-radius: 99px; background: var(--select); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--text); border-radius: 99px; transition: width .4s linear; }
.bar.paused > i { background: var(--mist); }
.check { color: var(--text); }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--text); animation: spin 1s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.toggle { width: 34px; height: 20px; border-radius: 99px; background: var(--line-strong); position: relative; flex: none; border: 0; cursor: pointer; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .15s; }
.toggle[aria-checked="true"] { background: var(--text); }
.toggle[aria-checked="true"]::after { left: 16px; background: var(--page); }
.toggle[disabled] { opacity: .5; cursor: not-allowed; }

/* ---------- macOS frames ---------- */
.mac-desk { position: relative; border-radius: 12px; overflow: hidden; background: var(--desk); min-height: 640px; border: 1px solid var(--line); font-family: var(--f-body); }
.menubar { height: 28px; display: flex; align-items: center; gap: 4px; padding: 0 10px; background: var(--menubar); backdrop-filter: blur(20px); font: 500 13px var(--f-mac); }
.menubar .left { display: flex; gap: 16px; align-items: center; padding-left: 6px; }
.menubar .left b { font-weight: 700; }
.menubar .right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.mb-item { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 5px; height: 22px; border: 0; background: transparent; cursor: default; }
.mb-item.pigeon { cursor: pointer; position: relative; }
.mb-item.pigeon.active { background: var(--select); }
.mb-item .logo { width: 22px; height: 22px; object-fit: cover; }
.mb-item.pigeon.busy::after { content: ""; position: absolute; right: 3px; top: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--signal); }
.mb-item .ico { width: 15px; height: 15px; }
.desk-area { position: relative; padding: 28px 20px 28px; display: flex; justify-content: center; align-items: flex-start; min-height: 612px; }

.popover { position: absolute; top: 6px; right: 150px; width: 340px; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--line); font-size: 13px; }
.popover::before { content: ""; position: absolute; top: -6px; right: 22px; width: 12px; height: 12px; background: var(--surface); transform: rotate(45deg); border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
.pop-sec { padding: 12px 14px; border-top: 1px solid var(--line); }
.pop-sec:first-child { border-top: 0; }
.pop-head { display: flex; align-items: center; gap: 10px; }
.pop-head .logo { width: 30px; height: 30px; object-fit: cover; }
.pop-list { list-style: none; margin: 6px 0 0; padding: 0; }
.pop-list li { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
.pop-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pop-foot { display: flex; justify-content: space-between; padding: 6px 8px; border-top: 1px solid var(--line); }
.pop-foot button { border: 0; background: transparent; padding: 4px 6px; border-radius: 5px; font-size: 12.5px; cursor: pointer; color: var(--text-2); }
.pop-foot button:hover { background: var(--hover); color: var(--text); }

.mac-win { width: 100%; max-width: 760px; background: var(--surface); border-radius: 11px; box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden; position: relative; }
.mac-title { height: 40px; display: flex; align-items: center; justify-content: center; position: relative; background: var(--chrome); border-bottom: 1px solid var(--line); font: 600 13px var(--f-mac); }
.lights { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; background: #FF5F57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.2); }
.lights i:nth-child(2) { background: #FEBC2E; }
.lights i:nth-child(3) { background: #28C840; }
.mac-tabs { display: flex; justify-content: center; gap: 4px; padding: 6px 8px 8px; background: var(--chrome); border-bottom: 1px solid var(--line); }
.mac-tabs button { border: 0; background: transparent; border-radius: 7px; padding: 5px 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; font: 500 11.5px var(--f-mac); color: var(--text-2); cursor: pointer; min-width: 68px; }
.mac-tabs button .ico { width: 20px; height: 20px; }
.mac-tabs button[aria-current="true"] { background: var(--select); color: var(--text); }
.mac-body { padding: 20px 24px 24px; min-height: 420px; }
.mac-list { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.mac-list .li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-top: 1px solid var(--line); }
.mac-list .li:first-child { border-top: 0; }
.mac-list .li:nth-child(even) { background: var(--surface-2); }
.dim { position: absolute; inset: 0; background: rgba(0,0,0,.18); z-index: 4; }
.sheet { position: absolute; z-index: 5; top: 40px; left: 50%; transform: translateX(-50%); width: min(520px, calc(100% - 24px)); background: var(--surface); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 12px 12px; box-shadow: var(--shadow); padding: 20px 22px 18px; }
.alert { position: absolute; z-index: 5; top: 90px; left: 50%; transform: translateX(-50%); width: min(300px, calc(100% - 24px)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 20px 16px 16px; text-align: center; font-family: var(--f-mac); }
.alert .logo { width: 56px; height: 56px; margin: 0 auto 6px; object-fit: cover; }
.alert .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.code-words { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.code-words div { border: 1px solid var(--line-strong); border-radius: 8px; padding: 10px 4px 8px; text-align: center; background: var(--surface-2); }
.code-words b { display: block; font: 500 19px var(--f-mono); letter-spacing: .01em; }
.code-words small { font: 500 10px var(--f-mono); color: var(--text-2); }
.linkbox { display: flex; gap: 8px; align-items: center; }
.linkbox code { flex: 1; min-width: 0; font: 400 12.5px var(--f-mono); border: 1px solid var(--line-strong); border-radius: 7px; padding: 7px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--surface-2); }
.step-n { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--text); display: inline-grid; place-items: center; font: 600 11px var(--f-body); flex: none; }
.notif { position: absolute; z-index: 8; top: 10px; right: 10px; width: 340px; max-width: calc(100% - 20px); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 10px 12px; display: flex; gap: 10px; font-family: var(--f-mac); font-size: 13px; }
.notif .logo { width: 34px; height: 34px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
.big-check { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--text); display: grid; place-items: center; margin: 4px auto 10px; }
.big-x { border-color: var(--signal); color: var(--signal); }
.kv { display: grid; grid-template-columns: 180px 1fr; gap: 14px 18px; align-items: center; }
.kv > .k { color: var(--text-2); text-align: right; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; font: 500 11.5px var(--f-body); color: var(--text-2); padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }

/* ---------- Windows 11 frames ---------- */
.win11 { max-width: 1040px; margin: 0 auto; background: var(--surface); border-radius: 8px; border: 1px solid var(--line-strong); box-shadow: var(--shadow); overflow: hidden; font-family: var(--f-body); position: relative; }
.w-title { height: 34px; display: flex; align-items: center; gap: 8px; padding-left: 12px; background: var(--mica); font: 400 12px var(--f-win); }
.w-title .logo { width: 20px; height: 20px; object-fit: cover; }
.w-caps { margin-left: auto; display: flex; height: 100%; }
.w-caps span { width: 46px; display: grid; place-items: center; }
.w-caps span:hover { background: var(--hover); }
.w-caps span:last-child:hover { background: #C42B1C; color: #fff; }
.w-caps .ico { width: 11px; height: 11px; stroke-width: 1.1; }
.w-body { display: flex; min-height: 600px; background: var(--mica); }
.w-nav { width: 232px; flex: none; padding: 8px 8px 12px; display: flex; flex-direction: column; gap: 2px; }
.w-nav .dev { padding: 10px 10px 12px; display: flex; gap: 10px; align-items: center; }
.w-nav .dev-ico { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line-strong); display: grid; place-items: center; background: var(--surface); }
.w-nav button.nav { border: 0; background: transparent; text-align: left; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 5px; cursor: pointer; position: relative; font-size: 13px; }
.w-nav button.nav:hover { background: var(--hover); }
.w-nav button.nav[aria-current="true"] { background: var(--select); }
.w-nav button.nav[aria-current="true"]::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--text); }
.w-nav button.nav.sub { padding-left: 36px; font-size: 12.5px; color: var(--text-2); }
.w-nav button.nav.sub.on { color: var(--text); font-weight: 600; }
.logo.hero { width: 56px; height: 56px; object-fit: cover; }
.pair-card > .logo.hero { margin-left: -6px; }
.w-nav .count { margin-left: auto; font: 500 11px var(--f-mono); background: var(--text); color: var(--page); border-radius: 99px; padding: 0 6px; }
.w-nav .spacer { flex: 1; }
.w-main { flex: 1; min-width: 0; background: var(--surface); border-top-left-radius: 8px; border-left: 1px solid var(--line); border-top: 1px solid var(--line); display: flex; flex-direction: column; }
.w-main.solo { border-radius: 0; border-left: 0; align-items: center; justify-content: center; padding: 32px 16px; }
.w-head { padding: 18px 24px 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.crumbs { display: flex; align-items: center; gap: 4px; font: 700 19px var(--f-head); letter-spacing: -.01em; flex-wrap: wrap; min-width: 0; }
.crumbs button { border: 0; background: transparent; padding: 2px 4px; border-radius: 5px; cursor: pointer; font: inherit; color: var(--text-2); }
.crumbs button:hover { background: var(--hover); color: var(--text); }
.crumbs .cur { padding: 2px 4px; }
.crumbs .ico { color: var(--text-2); width: 14px; height: 14px; }
.search { position: relative; width: 260px; max-width: 100%; }
.search .ico { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text-2); }
.search input { padding-left: 32px; border-bottom: 2px solid var(--line-strong); }
.search input:focus { outline: none; border-bottom-color: var(--text); }
.w-content { padding: 0 24px 20px; flex: 1; }
.files { width: 100%; border-collapse: collapse; font-size: 13px; }
.files th { text-align: left; font-weight: 500; font-size: 12px; color: var(--text-2); padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }

function winFrame(inner, { nav = null } = {}) {
  const navHtml = nav ? winNav(nav) : '';
  const tabs = nav ? `<div class="w-tabs">${[['w-browse','Browse'],['w-transfers','Transfers'],['w-settings','Settings']].map(([id,l])=>`<button data-go="${id}" aria-current="${navKey(nav)===id}">${l}</button>`).join('')}</div>` : '';
  return `<div class="win11" role="region" aria-label="Pigeon window">
    <div class="w-title">${LOGO()}<span>Pigeon</span><span class="muted t-long">${nav ? '· ' + MAC_NAME : ''}</span>
      <div class="w-caps"><span>${ic('min')}</span><span>${ic('max')}</span><span>${ic('x')}</span></div></div>
    <div class="w-body">${navHtml}${tabs}${inner}</div>
  </div>`;
}
const navKey = s => (['w-transfers','w-relay','w-dropped','w-changed'].includes(s) ? 'w-transfers' : s === 'w-settings' ? 'w-settings' : 'w-browse');
function winNav(s) {
  const off = s === 'w-offline';
  const active = st.xfers.filter(x => x.state === 'active').length;
  const k = navKey(s);
  const top = st.path.split('/')[0] === 'Projects' ? 'Projects/Q4' : 'ForHome';
  return `<nav class="w-nav" aria-label="Pigeon">
    <div class="dev"><div class="dev-ico">${ic('laptop')}</div><div class="grow"><div class="h3">${MAC_NAME}</div>
      <div class="small muted">${off ? 'Offline · seen 18:42' : s === 'w-dropped' ? 'Reconnecting…' : 'Online · Direct'}</div></div></div>
    <button class="nav" data-go="w-browse" aria-current="${k==='w-browse'}">${ic('folder')}Browse</button>
    <button class="nav sub ${k==='w-browse'&&top==='ForHome'?'on':''}" data-act="root" data-root="ForHome">ForHome</button>
    <button class="nav sub ${k==='w-browse'&&top==='Projects/Q4'?'on':''}" data-act="root" data-root="Projects/Q4">Projects/Q4</button>
    <button class="nav" data-go="w-transfers" aria-current="${k==='w-transfers'}">${ic('down')}Transfers${active?`<span class="count">${active}</span>`:''}</button>
    <div class="spacer"></div>
    <button class="nav" data-go="w-settings" aria-current="${k==='w-settings'}">${ic('gear')}Settings</button>
  </nav>`;
}

function listing(path) {
  const d = FS[path] || { folders: [], files: [] };
  return [...d.folders.map(f => ({ folder: true, name: f, path: path + '/' + f, count: (FS[path + '/' + f]?.files.length || 0) })),
          ...d.files.map(([name,size,mod]) => ({ name, size, mod }))];
}
function crumbs(path) {
  const parts = path.split('/');
  const roots = path.startsWith('Projects/Q4') ? [['Projects/Q4','Projects/Q4']] : [];
  let out = `<button data-act="root" data-root="ForHome">${MAC_NAME}</button>`;
  if (path.startsWith('Projects/Q4')) return out + ic('chev') + `<span class="cur">Projects/Q4</span>`;
  let acc = '';
  parts.forEach((p, i) => { acc = acc ? acc + '/' + p : p;
    out += ic('chev') + (i === parts.length - 1 ? `<span class="cur">${esc(p)}</span>` : `<button data-act="open" data-path="${esc(acc)}">${esc(p)}</button>`); });
  return out;
}
function browse(s) {
  const off = s === 'w-offline', search = s === 'w-search';
  let rows, title;
  if (search) {
    const q = st.q.toLowerCase();
    rows = []; Object.entries(FS).forEach(([p,d]) => d.files.forEach(([name,size,mod]) => { if (q && name.toLowerCase().includes(q)) rows.push({ name, size, mod, path: p }); }));
    title = `<div class="crumbs"><span class="cur">Results for \u201c${esc(st.q)}\u201d</span></div>`;
  } else { rows = listing(st.path); title = `<div class="crumbs">${crumbs(st.path)}</div>`; }
  return winFrame(`<div class="w-main">
    <div class="w-head">${title}<div class="grow"></div>
      <div class="search">${ic('search')}<input class="field" id="q" placeholder="Search file names" value="${search?esc(st.q):''}" aria-label="Search file names" ${off?'disabled':''}></div>
      ${off ? online(false) : online(true)}</div>
    ${off ? `<div style="padding:0 24px 12px" class="w-pad"><div class="banner attn">${ic('alert')}<p><b>${MAC_NAME} is offline.</b> Last seen today at 18:42. It may be asleep, shut down, or off the internet. Pigeon reconnects on its own. This list is from 18:42; you can\u2019t get files until the Mac is back.</p></div></div>` : ''}
    ${search ? `<div class="w-content" style="flex:none;padding-bottom:6px"><span class="small muted">${rows.length} ${rows.length===1?'file':'files'} in ForHome and Projects/Q4 · names only</span></div>` : ''}
    <div class="w-content">${rows.length ? filesTable(rows, { disabled: off, showPath: search }) : `<p class="muted" style="padding:30px 0;text-align:center">No file names match \u201c${esc(st.q)}\u201d.</p>`}</div>
    <div class="w-status">${ic('shield')}<span>Read-only. Files stay on the Mac.</span><span class="grow"></span><span>Saving to <span class="mono">Downloads\\Pigeon</span></span></div>
  </div>`, { nav: s });
}
function fmt(x) { return x.unit === 'KB' ? x.size + ' KB' : x.size >= 1000 ? (x.size/1000).toFixed(1) + ' GB' : x.size + ' MB'; }
function fmtGot(x) { return x.got >= 1000 ? (x.got/1000).toFixed(2) + ' GB' : Math.round(x.got) + ' MB'; }
function eta(x) { const sp = parseFloat(x.speed); const s = Math.max(1, Math.round((x.size - x.got) / sp)); return s >= 60 ? Math.round(s/60) + ' min left' : s + ' s left'; }
function xferRow(x) {
  const pct = x.got != null ? Math.round(x.got / x.size * 100) : 100;
  if (x.state === 'done') return `<div class="xfer"><div class="fico">${ic('file')}</div>
    <div class="row" style="gap:8px;flex-wrap:wrap"><span class="h3 trunc">${esc(x.savedAs || x.name)}</span><span class="small muted mono">${fmt(x)}</span></div>
    <div class="acts">${B('Open', { k: 'sm', i: 'open' })}${B('Show in folder', { k: 'sm', i: 'folder' })}</div>
    <div class="meta"><span class="verified">${ic('check')}SHA-256 verified</span>${route(x.route)}<span>Done 09:39</span>
      ${x.savedAs ? `<span>Saved as a new copy: <span class="mono">${esc(x.name)}</span> already existed</span>` : ''}</div></div>`;
  if (x.state === 'changed') return `<div class="xfer err"><div class="fico">${ic('alert')}</div>
    <div class="h3 trunc">${esc(x.name)}</div><div class="acts">${B('Get again', { k: 'sm primary', i: 'refresh' })}</div>
    <div class="meta"><span style="color:var(--signal-text);font-weight:500">Changed on the Mac while downloading.</span><span>The partial copy was deleted so you don\u2019t get a mix of old and new.</span></div></div>`;
  if (x.state === 'mismatch') return `<div class="xfer err"><div class="fico">${ic('alert')}</div>
    <div class="h3 trunc">${esc(x.name)}</div><div class="acts">${B('Try again', { k: 'sm', i: 'refresh' })}</div>
    <div class="meta"><span style="color:var(--signal-text);font-weight:500">Checksum didn\u2019t match.</span><span>The file was discarded. Nothing broken was saved.</span></div></div>`;
  const paused = x.state === 'reconnecting' || x.state === 'waiting';
  const status = x.state === 'reconnecting' ? `<span class="row" style="gap:6px"><span class="spinner"></span>Connection lost at ${pct}%. Reconnecting… resumes from <span class="mono">${fmtGot(x)}</span></span>`
    : x.state === 'waiting' ? `<span>Paused until ${MAC_NAME} is reachable. Resumes from <span class="mono">${fmtGot(x)}</span>; nothing is downloaded twice.</span>`
    : `<span class="mono" data-m="${x.id}">${fmtGot(x)} of ${fmt(x)} · ${x.speed} · ${eta(x)}</span>`;
  return `<div class="xfer"><div class="fico">${ic('file')}</div>
    <div class="row" style="gap:8px"><span class="h3 trunc">${esc(x.name)}</span><span class="small muted mono" data-p="${x.id}">${pct}%</span></div>
    <div class="acts">${paused ? B('Cancel', { k: 'sm ghost', i: 'x' }) : B('Pause', { k: 'sm ghost', i: 'pause', aria: 'Pause' })}</div>
    <div class="bar wide ${paused?'paused':''}"><i data-b="${x.id}" style="width:${pct}%"></i></div>
    <div class="meta wide">${route(x.route)}${status}</div></div>`;
}
function transfers(s) {
  let list = st.xfers;
  if (s === 'w-dropped') list = [
    { id: 11, name: 'deck-v3.key', size: 184, unit: 'MB', got: 113, route: 'direct', state: 'reconnecting' },
    { id: 12, name: 'raw-footage.mov', size: 1200, unit: 'MB', got: 412, route: 'relay', state: 'waiting' },
    ...st.xfers.filter(x => x.state === 'done') ];
  if (s === 'w-changed') list = [
    { id: 21, name: 'budget-2027.xlsx', size: 312, unit: 'KB', state: 'changed' },
    { id: 22, name: 'figures.zip', size: 41, unit: 'MB', state: 'mismatch' },
    ...st.xfers.filter(x => x.state === 'done') ];
  const active = list.filter(x => !['done'].includes(x.state)), done = list.filter(x => x.state === 'done');
  const tip = s === 'w-relay' ? `<div class="tip" style="top:262px;left:30px" role="dialog" aria-label="Why relay">
      <div class="h3">Why \u201cRelay\u201d?</div>
      <p style="margin:6px 0 0">Something between this PC and the Mac (usually a firewall) blocks a direct link, so the bytes go through Pigeon\u2019s relay instead.</p>
      <div class="route-diagram"><span class="n">This PC</span><hr><span class="n">Relay</span><hr><span class="n">${MAC_NAME}</span></div>
      <p style="margin:0">They\u2019re encrypted end to end; the relay can\u2019t read them. <b>Slower, not less safe.</b> Pigeon switches to Direct if it becomes possible.</p>
      <div class="row" style="justify-content:flex-end;margin-top:10px">${B('Got it', { k: 'sm primary', go: 'w-transfers' })}</div></div>` : '';
  return winFrame(`<div class="w-main" style="position:relative">
    <div class="w-head"><div class="crumbs"><span class="cur">Transfers</span></div><div class="grow"></div>${B('Clear finished', { k: 'sm ghost' })}</div>
    <div class="w-content">
      ${active.length ? `<div class="label" style="margin-top:4px">In progress</div>${active.map(xferRow).join('')}` : ''}
      ${done.length ? `<div class="label" style="margin-top:18px">Finished</div>${done.map(xferRow).join('')}` : ''}
    </div>
    <div class="w-status">${ic('folder')}<span>Saving to <span class="mono">C:\\Users\\you\\Downloads\\Pigeon</span></span><button class="btn sm ghost" data-go="w-settings">Change</button><span class="grow"></span><span>Never overwrites</span></div>
    ${tip}
  </div>`, { nav: s });
}
function winScreen(s) {
  switch (s) {
    case 'w-link': return pairShell(`<h1 class="h1">Pair with your Mac</h1>
      <p class="muted" style="margin:6px 0 16px">On your Mac, open Pigeon and click <b>Pair a device</b>. Paste the link it gives you.</p>
      <label class="small" for="lnk" style="font-weight:500">Invite link</label>
      <div class="row" style="margin-top:4px"><input class="field mono" id="lnk" value="${LINK}" style="font-size:12px"> ${B('Paste', { k: 'sm' })}</div>
      <div class="card" style="padding:10px 12px;margin-top:12px;display:flex;gap:10px;align-items:center">${ic('check')}<div class="grow small"><b>Invite from ${MAC_NAME}</b><div class="muted">Expires in 9 h 12 m · single use</div></div></div>
      <p class="small muted" style="margin-top:12px">The link only finds your Mac. Pairing also needs the 4-word code that\u2019s on the Mac screen.</p>
      <div class="row" style="margin-top:18px;justify-content:flex-end">${B('Next', { k: 'primary lg', go: 'w-code' })}</div>`, 1);
    case 'w-code': return codeScreen(false);
    case 'w-code-wrong': return codeScreen(true);
    case 'w-paired': return pairShell(`<div class="big-check" style="margin:22px 0 10px">${ic('check','lg')}</div>
      <h1 class="h1">Paired with ${MAC_NAME}</h1>
      <p class="muted" style="margin:6px 0 16px">Check these match what the Mac shows. If they don\u2019t, click Forget and pair again.</p>
      <div class="fp-pair"><div class="card">${ic('laptop')}<div class="label" style="margin-top:6px">${MAC_NAME}</div><span class="fp">${FP_MAC}</span></div>
        <div class="card">${ic('pc')}<div class="label" style="margin-top:6px">This PC</div><span class="fp">${FP_PC}</span></div></div>
      <div class="row" style="margin-top:20px;justify-content:space-between">${B('Forget', { k: 'danger', go: 'w-link' })}${B('Browse files', { k: 'primary lg', go: 'w-browse' })}</div>`);
    case 'w-browse': case 'w-search': case 'w-offline': return browse(s);
    case 'w-transfers': case 'w-relay': case 'w-dropped': case 'w-changed': return transfers(s);
    case 'w-expired': case 'w-burned': case 'w-used': return inviteProblem(s);
    case 'w-settings': return winFrame(`<div class="w-main">
      <div class="w-head"><div class="crumbs"><span class="cur">Settings</span></div></div>
      <div class="w-content">
        <div class="set-sec"><div class="h3">Download folder</div>
          <div class="set-row" style="margin-top:8px"><code class="mono small card" style="padding:6px 10px">C:\\Users\\you\\Downloads\\Pigeon</code>${B('Change…', { k: 'sm' })}</div>
          <p class="small muted" style="margin:8px 0 0">Pigeon never overwrites. If <span class="mono">report.pdf</span> is already there, the new copy is saved as <span class="mono">report (1).pdf</span>.</p></div>
        <div class="set-sec"><div class="h3">Paired Macs</div>
          <div class="card" style="margin-top:8px;padding:10px 12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">${ic('laptop','lg')}<div class="grow"><b>${MAC_NAME}</b><div class="small muted"><span class="fp">${FP_MAC}</span> · paired 23 Nov 2026</div></div>${online(true)}${B('Forget', { k: 'sm danger', go: 'w-revoked' })}</div>
          <div style="margin-top:8px">${B('Pair another Mac', { k: 'sm', i: 'plus', go: 'w-link' })}</div></div>
        <div class="set-sec"><div class="h3">This PC</div><p class="small" style="margin:6px 0 0"><span class="fp">${FP_PC}</span> <span class="muted">· your Mac shows this under Devices</span></p></div>
        <div class="set-sec"><div class="h3">Appearance</div><div class="seg" style="margin-top:8px"><button aria-pressed="true">System</button><button>Light</button><button>Dark</button></div></div>
        <div class="set-sec small muted">Pigeon 0.1.0 · <span class="mono">early build</span></div>
      </div></div>`, { nav: s });
    case 'w-revoked': return pairShell(`<div class="big-check big-x" style="margin:22px 0 10px">${ic('x','lg')}</div>
      <h1 class="h1">${MAC_NAME} doesn\u2019t accept this PC any more</h1>
      <p class="muted" style="margin:8px 0 18px">It was removed on the Mac, or the Mac was reset. Files you already downloaded are still in <span class="mono">Downloads\\Pigeon</span>.</p>
      <div class="row" style="flex-wrap:wrap">${B('Pair again', { k: 'primary', go: 'w-link' })}${B('Forget ' + MAC_NAME, { go: 'w-link' })}</div>`);
  }
}

/* ---------- Render ---------- */
const $ = sel => document.querySelector(sel);
let timer = null;
function render() {
  if (st.s === 'w-code-wrong' && st.attempts === 3) { st.attempts = 2; st.code = ['otter','plaza','crust','vivid']; }
  document.documentElement.toggleAttribute('data-theme', st.t !== 'auto');
  if (st.t !== 'auto') document.documentElement.setAttribute('data-theme', st.t);
  document.body.classList.toggle('bare', st.bare);
  document.querySelectorAll('[data-plat]').forEach(b => b.setAttribute('aria-pressed', b.dataset.plat === st.p));
  document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeSet === st.t));
  const groups = {};
  SCREENS[st.p].forEach(([g,id,l,w]) => (groups[g] = groups[g] || []).push([id,l,w]));
  $('#states').innerHTML = Object.entries(groups).map(([g,items]) => `<div class="sgroup"><span>${g}</span>${items.map(([id,l,w]) => `<button class="chip ${w?'warn':''}" data-go="${id}" aria-current="${st.s===id}">${l}</button>`).join('')}</div>`).join('')
    + `<select class="field state-select" id="pick" aria-label="Screen">${Object.entries(groups).map(([g,items]) => `<optgroup label="${g}">${items.map(([id,l]) => `<option value="${id}" ${st.s===id?'selected':''}>${l}</option>`).join('')}</optgroup>`).join('')}</select>`;
  $('#pick').addEventListener('change', e => go(e.target.value));
  $('#frame').innerHTML = st.p === 'mac' ? macScreen(st.s) : winScreen(st.s);
  $('#note').innerHTML = NOTES[st.s] || '';
  writeHash();
  wire();
}
function go(s) {
  if (s.startsWith('w-') !== (st.p === 'win')) st.p = s.startsWith('w-') ? 'win' : 'mac';
  if (s === 'w-search' && !st.q) st.q = 'report';
  st.s = s; render();
}

function wire() {
  clearInterval(timer);
  if (st.s === 'w-transfers' && !st.bare) timer = setInterval(tick, 600);
  const q = $('#q');
  if (q) {
    if (st.s === 'w-search') { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    q.addEventListener('input', () => { st.q = q.value; if (q.value.trim()) go('w-search'); else go('w-browse'); });
  }
  const wi = $('#wordin');
  if (wi) wireCode(wi);
}
function tick() {
  let changed = false;
  st.xfers.forEach(x => {
    if (x.state !== 'active') return;
    x.got = Math.min(x.size, x.got + parseFloat(x.speed) * 0.6);
    if (x.got >= x.size) { x.state = 'done'; x.got = null; changed = true; return; }
    const pct = Math.round(x.got / x.size * 100);
    const b = document.querySelector(`[data-b="${x.id}"]`); if (b) b.style.width = pct + '%';
    const p = document.querySelector(`[data-p="${x.id}"]`); if (p) p.textContent = pct + '%';
    const m = document.querySelector(`[data-m="${x.id}"]`); if (m) m.textContent = `${fmtGot(x)} of ${fmt(x)} · ${x.speed} · ${eta(x)}`;
  });
  if (changed) render();
}

/* ---------- Code input with word autocompletion ---------- */
function wireCode(root) {
  const ins = [...root.querySelectorAll('input')];
  const matches = v => v.length < 2 ? [] : WORDS.filter(w => w.startsWith(v) && w !== v).slice(0, 4);
  const paint = (i, showList) => {
    const inp = ins[i], v = inp.value.trim().toLowerCase(), box = inp.parentElement;
    const m = matches(v);
    root.querySelectorAll('.sugg').forEach(n => n.remove());
    const g = box.querySelector('.ghost');
    g.textContent = (m[0] && document.activeElement === inp) ? ' '.repeat(v.length) + m[0].slice(v.length) : '';
    box.classList.toggle('unknown', !!v && !WORDS.includes(v) && !m.length);
    if (showList && m.length && document.activeElement === inp) {
      const d = document.createElement('div'); d.className = 'sugg';
      d.innerHTML = m.map(w => `<button type="button" tabindex="-1" data-word="${w}">${w}</button>`).join('');
      d.addEventListener('mousedown', e => { const b = e.target.closest('[data-word]'); if (!b) return; e.preventDefault(); accept(i, b.dataset.word); });
      box.appendChild(d);
    }
  };
  const accept = (i, w) => { ins[i].value = w; st.code[i] = w; paint(i, false); if (ins[i+1]) ins[i+1].focus(); else root.querySelectorAll('.sugg').forEach(n => n.remove()); };
  const fill = (start, words) => { words.forEach((w, k) => { if (ins[start+k]) { ins[start+k].value = w; st.code[start+k] = w; } }); const last = Math.min(3, start + words.length); (ins[last] || ins[3]).focus(); ins.forEach((_, k) => paint(k, false)); };
  ins.forEach((inp, i) => {
    inp.addEventListener('focus', () => paint(i, true));
    inp.addEventListener('blur', () => setTimeout(() => paint(i, false), 0));
    inp.addEventListener('input', () => {
      inp.parentElement.classList.remove('bad');
      const raw = inp.value.toLowerCase();
      if (/[\s\-·.,]/.test(raw)) {
        const parts = raw.split(/[\s\-·.,]+/).filter(Boolean);
        if (parts.length > 1) { fill(i, parts); return; }
        const m = matches(parts[0] || '');
        if (parts[0]) { accept(i, WORDS.includes(parts[0]) ? parts[0] : (m[0] || parts[0])); return; }
        inp.value = ''; return;
      }
      st.code[i] = inp.value.trim().toLowerCase(); paint(i, true);
    });
    inp.addEventListener('paste', e => {
      const t = (e.clipboardData || window.clipboardData).getData('text');
      const parts = t.toLowerCase().split(/[^a-z]+/).filter(Boolean);
      if (parts.length > 1) { e.preventDefault(); fill(i, parts); }
    });
    inp.addEventListener('keydown', e => {
      const v = inp.value.trim().toLowerCase(), m = matches(v);
      if ((e.key === 'Tab' && !e.shiftKey || e.key === 'Enter') && m[0]) { e.preventDefault(); accept(i, m[0]); }
      else if (e.key === 'Enter') { e.preventDefault(); doPair(); }
      else if (e.key === 'Backspace' && !inp.value && ins[i-1]) { e.preventDefault(); ins[i-1].focus(); }
    });
  });
  // Show the static "typing" state for screenshots / first view.
  const firstEmpty = st.code.findIndex(w => !WORDS.includes(w));
  if (st.s === 'w-code' && firstEmpty >= 0) { ins[firstEmpty].focus(); const v = ins[firstEmpty].value; ins[firstEmpty].setSelectionRange(v.length, v.length); paint(firstEmpty, true); }
}
function doPair() {
  const ok = st.code.map(w => w.trim().toLowerCase()).join('-') === CODE.join('-');
  if (ok) { st.attempts = 3; go('w-paired'); return; }
  st.attempts -= 1;
  if (st.attempts <= 0) { st.attempts = 3; st.code = ['otter','plaza','cru','']; go('w-burned'); return; }
  st.s = 'w-code-wrong'; render();
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-plat],[data-theme-set],[data-go],[data-act]');
  if (!t || t.disabled) return;
  if (t.dataset.plat) { st.p = t.dataset.plat; st.s = st.p === 'mac' ? 'm-popover' : 'w-browse'; render(); return; }
  if (t.dataset.themeSet) { st.t = t.dataset.themeSet; render(); return; }
  if (t.dataset.go) { if (t.dataset.go === 'w-transfers' && st.s === 'w-relay') {} go(t.dataset.go); return; }
  const a = t.dataset.act;
  if (a === 'pair') doPair();
  else if (a === 'open') { st.path = t.dataset.path; go('w-browse'); }
  else if (a === 'root') { st.path = t.dataset.root; st.q = ''; go('w-browse'); }
  else if (a === 'sel') { st.sel = t.dataset.name; document.querySelectorAll('tr.sel').forEach(r => r.classList.remove('sel')); t.classList.add('sel'); }
  else if (a === 'get') {
    e.stopPropagation();
    const name = t.dataset.name, sizeTxt = t.dataset.size;
    const n = parseFloat(sizeTxt), unit = /GB/.test(sizeTxt) ? 'MB' : /KB/.test(sizeTxt) ? 'KB' : 'MB';
    const size = /GB/.test(sizeTxt) ? n * 1000 : n;
    const exists = st.xfers.some(x => x.name === name);
    st.xfers.unshift(unit === 'KB' || size < 5
      ? { id: Date.now(), name, size: n, unit, state: 'done', route: 'direct', savedAs: exists ? name.replace(/(\.[^.]+)$/, ' (1)$1') : null }
      : { id: Date.now(), name, size, unit, got: 0, speed: '11.4 MB/s', route: 'direct', state: 'active' });
    go('w-transfers');
  }
  else if (a === 'toggle') t.setAttribute('aria-checked', t.getAttribute('aria-checked') !== 'true');
  else if (a === 'copy') { try { navigator.clipboard.writeText(LINK); } catch (_) {} t.querySelector('.lbl').textContent = 'Copied'; }
});
window.addEventListener('hashchange', () => { readHash(); render(); });
readHash(); render();
})();
</script>
</body>
