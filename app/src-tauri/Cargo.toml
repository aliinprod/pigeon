[package]
name = "pigeon-app"
description = "Pigeon desktop app: Share and Get in one process, on one iroh endpoint"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace (own Cargo.lock): Tauri pulls in GUI crates (webview2,
# gtk on Linux) that the core / agent / CLI must not depend on, and the core
# CI job stays as fast and lean as it was. pigeon-core's pins still come from
# the root workspace.
[workspace]

[lib]
name = "pigeon_app"
path = "src/lib.rs"

[[bin]]
name = "pigeon-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
pigeon-core = { path = "../../crates/pigeon-core" }
# Exact pins, same as the root workspace.
iroh = "=1.5.0"
tokio = { version = "=1.54.1", features = ["full"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
anyhow = "=1.0.104"
zeroize = "=1.9.2"
tauri = { version = "=2.12.5", features = ["image-png"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"

# Tray / menu bar icon on Windows and macOS only. Linux is window-only for
# now (stock GNOME has no tray), so it needs no appindicator library.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri = { version = "=2.12.5", features = ["image-png", "tray-icon"] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
codegen-units = 4
lto = "thin"
