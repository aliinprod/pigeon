name: cross-network

# A real transfer between two machines on two different networks:
# the agent runs on a GitHub macOS runner, the client on a Windows runner.
#
# Pairing hand-off between the two parallel jobs (the real user flow:
# `pigeon-agent pair` on the Mac, `pigeon pair` on Windows, then ls/get with
# no ticket):
#   agent  --upload-artifact--> pigeon-invite-<attempt>      --poll REST API--> client
#   client --upload-artifact--> pigeon-client-done-<attempt> --poll REST API--> agent
# (v4 artifacts are listed by the API as soon as their upload step finishes.)
# The artifact holds the invite link and its 4-word code. The code is
# single use and expires in 12 h; it only lives in this private repo's
# artifacts (1-day retention) and is masked in every log.
# CHECKLIST before making the repository public (W-10, THREAT_MODEL R12):
# anyone could then download the artifact and race this job; generate the
# code differently or shorten the window first.

on:
  workflow_dispatch:
    inputs:
      size_mib:
        description: "Size of the test file for the normal (auto) transfer, in MiB"
        default: "10"
      relay_mib:
        description: "Size of the test file for the relay-only transfer, in MiB"
        default: "1"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cross-network.yml"
      - ".github/scripts/wait-artifact.sh"
      - ".github/scripts/transfer-check.sh"

permissions:
  contents: read
  actions: read # list/download this run's artifacts

concurrency:
  group: cross-network-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SIZE_MIB: ${{ inputs.size_mib || '10' }}
  # The public relay was measured at ~30 KB/s, so keep the relay-only file small.
  RELAY_MIB: ${{ inputs.relay_mib || '1' }}
  INVITE_ARTIFACT: pigeon-invite-${{ github.run_attempt }}
  DONE_ARTIFACT: pigeon-client-done-${{ github.run_attempt }}

jobs:
  agent:
    name: agent (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release
      - name: build
        run: cargo build --release --locked -p pigeon-agent -p pigeon-cli
      - name: create share
        run: |
          # Inputs reach bash arithmetic below, which would evaluate
          # e.g. `a[$(cmd)]`: accept plain numbers in a sane range only.
          for v in "$SIZE_MIB" "$RELAY_MIB"; do
            case "$v" in
              '' | *[!0-9]* | 0*) echo "::error::sizes must be whole MiB without leading zeros"; exit 1 ;;
            esac
            if [ "${#v}" -gt 4 ] || [ "$v" -gt 1024 ]; then
              echo "::error::size $v MiB is above the 1024 MiB limit"; exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/share" "$RUNNER_TEMP/handoff"
          head -c $((SIZE_MIB * 1024 * 1024)) /dev/urandom >"$RUNNER_TEMP/share/random.bin"
          head -c $((RELAY_MIB * 1024 * 1024)) /dev/urandom >"$RUNNER_TEMP/share/relay.bin"
          shasum -a 256 "$RUNNER_TEMP/share/random.bin" | cut -d' ' -f1 >"$RUNNER_TEMP/handoff/random.sha256"
          shasum -a 256 "$RUNNER_TEMP/share/relay.bin" | cut -d' ' -f1 >"$RUNNER_TEMP/handoff/relay.sha256"
          ls -l "$RUNNER_TEMP/share"
          cat "$RUNNER_TEMP/handoff/"*.sha256
      - name: start agent and create a pairing invite
        run: |
          # The device key goes to the runner's login Keychain (real keystore).
          nohup target/release/pigeon-agent share "$RUNNER_TEMP/share" \
            >"$RUNNER_TEMP/agent.out" 2>"$RUNNER_TEMP/agent.err" &
          echo $! >"$RUNNER_TEMP/agent.pid"
          for _ in $(seq 60); do
            grep -q '^sharing ' "$RUNNER_TEMP/agent.err" && break
            sleep 1
          done
          if ! grep -q '^sharing ' "$RUNNER_TEMP/agent.err"; then
            echo "::error::agent did not start"
            cat "$RUNNER_TEMP/agent.err"
            exit 1
          fi
          # stdout carries the link and the code: files only, never the log.
          target/release/pigeon-agent pair --name "CI Windows runner" \
            >"$RUNNER_TEMP/pair.out" 2>"$RUNNER_TEMP/pair.err"
          sed -n 's/^link: //p' "$RUNNER_TEMP/pair.out" >"$RUNNER_TEMP/handoff/link"
          code=$(sed -n 's/^code: //p' "$RUNNER_TEMP/pair.out")
          if [ -z "$code" ] || [ ! -s "$RUNNER_TEMP/handoff/link" ]; then
            echo "::error::pigeon-agent pair printed no invite"
            cat "$RUNNER_TEMP/pair.err"
            exit 1
          fi
          echo "::add-mask::$code"
          printf '%s\n' "$code" >"$RUNNER_TEMP/handoff/code"
          rm -f "$RUNNER_TEMP/pair.out"
          cat "$RUNNER_TEMP/agent.err"
      - name: one key for both programs (real Keychain)
        # Informational (PAIRING.md D9): `pigeon` reads the key that
        # `pigeon-agent` stored. If macOS asked "allow pigeon to access
        # device-key?", this step would time out instead of failing the run.
        continue-on-error: true
        timeout-minutes: 2
        run: |
          a=$(target/release/pigeon-agent whoami | sed -n 's/^fingerprint: *//p')
          c=$(target/release/pigeon whoami | sed -n 's/^fingerprint: *//p')
          echo "pigeon-agent whoami: $a, pigeon whoami: $c"
          echo "macOS Keychain, one key for both programs: pigeon-agent \`$a\`, pigeon \`$c\`" >>"$GITHUB_STEP_SUMMARY"
          [ -n "$a" ] && [ "$a" = "$c" ]
      - name: publish invite
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.INVITE_ARTIFACT }}
          path: ${{ runner.temp }}/handoff/
          retention-days: 1
          if-no-files-found: error
      - name: serve until the client is done
        run: |
          bash .github/scripts/wait-artifact.sh "$DONE_ARTIFACT" "$RUNNER_TEMP/done" 1800
          echo "client reported: $(cat "$RUNNER_TEMP/done/status" 2>/dev/null || echo unknown)"
          if ! kill -0 "$(cat "$RUNNER_TEMP/agent.pid")" 2>/dev/null; then
            echo "::error::the agent exited before the client was done"
            exit 1
          fi
      - name: stop agent
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/agent.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/agent.pid")" 2>/dev/null || true
          fi
          echo "--- agent stderr (no secrets) ---"
          cat "$RUNNER_TEMP/agent.err" 2>/dev/null || true

  client:
    name: client (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release
      - name: build
        run: cargo build --release --locked -p pigeon-cli
      - name: get invite
        run: |
          bash .github/scripts/wait-artifact.sh "$INVITE_ARTIFACT" "$RUNNER_TEMP/handoff" 1800
          echo "::add-mask::$(tr -d '\r\n' <"$RUNNER_TEMP/handoff/code")"
      - name: pigeon pair
        run: |
          # The code comes from a file, never an argument (TH-14). The device
          # key goes to Windows Credential Manager (real keystore).
          link=$(tr -d '\r\n' <"$RUNNER_TEMP/handoff/link")
          target/release/pigeon.exe pair "$link" --name "CI macOS runner" \
            --code-file "$RUNNER_TEMP/handoff/code"
          target/release/pigeon.exe agents
          target/release/pigeon.exe whoami
      - name: pigeon ls
        run: |
          # No ticket any more: the agent knows this device by its key.
          target/release/pigeon.exe ls
          {
            echo "### Cross-network transfer (agent: macOS runner, client: Windows runner)"
            echo
            echo "| mode | route | bytes | seconds | MB/s | sha256 match |"
            echo "|---|---|---|---|---|---|"
          } >>"$GITHUB_STEP_SUMMARY"
      - name: pigeon get (auto, direct if possible)
        timeout-minutes: 8
        working-directory: ${{ runner.temp }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/transfer-check.sh" \
            "$GITHUB_WORKSPACE/target/release/pigeon.exe" handoff/random.sha256 \
            random.bin auto
      - name: pigeon get --relay-only
        if: success() || failure()
        timeout-minutes: 6
        working-directory: ${{ runner.temp }}
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/transfer-check.sh" \
            "$GITHUB_WORKSPACE/target/release/pigeon.exe" handoff/relay.sha256 \
            relay.bin relay-only
      - name: write done marker
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/done"
          echo "${{ job.status }}" >"$RUNNER_TEMP/done/status"
      - name: tell the agent we are done
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.DONE_ARTIFACT }}
          path: ${{ runner.temp }}/done/
          retention-days: 1
