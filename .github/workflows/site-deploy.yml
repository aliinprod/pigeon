name: site-deploy

# Builds the office status from GitHub (read-only) and deploys site/ + functions/ to
# Cloudflare Pages (project flypigeon). Status is built at deploy time and is never
# committed, so nothing here writes to main. See office/README.md.
#
# Two jobs: `plan` has no secrets and decides whether to deploy; `deploy` runs in the
# `production` environment (deployment branches: main only), which holds the Cloudflare
# secrets. So no other branch, and no fork PR, can ever read them.
#
# Every third-party action is pinned to a full commit SHA (tag in the comment).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "functions/**"
      - "office/**"
      - ".github/workflows/site-deploy.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read # the "Office status" issue
  pull-requests: read # open and recently merged PRs
  checks: read # CI results per PR
  statuses: read # commit statuses per PR
  actions: read # CI results on main

concurrency:
  group: site-deploy
  cancel-in-progress: false

env:
  WRANGLER_VERSION: 4.160.0
  SITE_URL: https://flypigeon.pages.dev

jobs:
  plan:
    name: build status + decide
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: test the status builder
        run: node --test office/build-status.test.mjs

      - name: build status.json from GitHub
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node office/build-status.mjs --fingerprint | tee build.out
          echo "fingerprint=$(sed -n 's/^fingerprint=//p' build.out)" >> "$GITHUB_OUTPUT"
          node office/sync-status.mjs
          node office/sync-status.mjs --check

      # Scheduled runs deploy only when the status (or the code) changed since the last deploy.
      - name: look up the last deployed state
        id: seen
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build.out
          key: office-deployed-${{ github.sha }}-${{ steps.build.outputs.fingerprint }}
          lookup-only: true

      - name: decide
        id: decide
        env:
          HIT: ${{ steps.seen.outputs.cache-hit }}
        run: |
          if [ "$HIT" = "true" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Status and code unchanged since the last deploy; skipping." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: deploy to Cloudflare Pages
    needs: plan
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production # secrets live here; deployment branches: main only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: build status.json from GitHub
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node office/build-status.mjs --fingerprint | tee build.out
          echo "fingerprint=$(sed -n 's/^fingerprint=//p' build.out)" >> "$GITHUB_OUTPUT"
          node office/sync-status.mjs
          node office/sync-status.mjs --check

      - name: check Cloudflare secrets
        id: secrets
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ] && [ "$HAS_ACCOUNT" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            msg="Deploy skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as secrets of the 'production' environment (see office/README.md)."
            echo "::notice title=site-deploy::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: deploy (from the repo root, so functions/ is included)
        id: deploy
        if: steps.secrets.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -f functions/_middleware.js
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy site \
            --project-name flypigeon --branch main --commit-dirty=true

      # Pass only when the login gate answers 401: the middleware is deployed AND the
      # OFFICE_USER_SHA256 / OFFICE_PASS_SHA256 env vars are set in Cloudflare. 503 means the
      # gate is deployed but those vars are missing or malformed (office closed, not public).
      # 200 means the gate is missing (office public).
      - name: check the login gate and the home page
        if: steps.deploy.outcome == 'success'
        run: |
          for i in 1 2 3 4 5 6; do
            office="$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/office/")"
            office_json="$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/office/status.json")"
            home="$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/")"
            echo "try $i: /office/ $office, /office/status.json $office_json, / $home"
            if [ "$office" = "401" ] && [ "$office_json" = "401" ] && [ "$home" = "200" ]; then
              echo "Gate OK: /office/ 401, / 200." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          if [ "$office" = "503" ]; then
            echo "::error title=site-deploy::/office/ answers 503: the login gate is deployed but OFFICE_USER_SHA256 / OFFICE_PASS_SHA256 are missing or malformed in Cloudflare (Workers & Pages > flypigeon > Settings > Variables and Secrets, Production). The office is closed, not public. Set them and re-run."
          elif [ "$office" = "200" ] || [ "$office_json" = "200" ]; then
            echo "::error title=site-deploy::/office/ is PUBLIC (200): functions/ was not deployed. Redeploy from the repo root now."
          else
            echo "::error title=site-deploy::expected /office/ 401, /office/status.json 401 and / 200; got $office, $office_json, $home."
          fi
          exit 1

      - name: remember the deployed state
        if: steps.deploy.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build.out
          key: office-deployed-${{ github.sha }}-${{ steps.build.outputs.fingerprint }}
